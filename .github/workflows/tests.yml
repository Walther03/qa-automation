name: Automated Test Execution

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite de pruebas a ejecutar (api o web)'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - web

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Determinar Suite de TestNG
        id: select-suite
        run: |
          if [ "${{ github.event.inputs.suite }}" = "web" ]; then
            echo "suite_file=src/test/resources/testng-web.xml" >> $GITHUB_OUTPUT
          else
            echo "suite_file=src/test/resources/testng-api.xml" >> $GITHUB_OUTPUT
          fi

      - name: Ejecutar Pruebas con Maven
        run: |
          mvn clean test -DsuiteXmlFile=${{ steps.select-suite.outputs.suite_file }} -Denv=qa
        continue-on-error: true

      - name: Validar Generación de Resultados Allure
        if: always()
        run: |
          echo "=== Archivos generados en target/allure-results ==="
          ls -la target/allure-results || echo "Directorio vacio o no encontrado"

      - name: Instalar Allure CLI y Generar Reporte Single-File
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate target/allure-results --single-file --clean -o allure-report
          touch allure-report/.nojekyll

      - name: Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: false
